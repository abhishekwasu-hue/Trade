# थर 7 event calendar (Abhi उत्तरं 14 आणि batch 2 चा निर्णय 5) — data file (code मध्ये तारीख नाही).
# प्रत्येक entry: date, name, kind (rbi / fomc / budget / expiry / holiday / other), added_on (= known_at; replay मध्ये
# त्या दिवसाआधी ही entry माहीत नव्हती). ऐच्छिक: ist_date (भारतात परिणामाचा दिवस; window त्यावर), verify (true ⇒ Abhi ने तपासायचं),
# symbol / series (expiry), source.
# Size (gate नाही): size_kinds (decision2 settings `event_size_kinds` = rbi, fomc, budget) — event दिवस + आधीचा 1 session ⇒ ×0.5.
# expiry / holiday = calendar data (size window नाही).
expiry_rules:
  - {symbol: NIFTY, series: weekly, rule: "प्रत्येक मंगळवार; सुट्टी ⇒ आधीचा trading day"}
  - {symbol: SENSEX, series: weekly, rule: "प्रत्येक गुरुवार; सुट्टी ⇒ आधीचा trading day"}
  - {symbol: NIFTY, series: monthly, rule: "महिन्याचा शेवटचा मंगळवार; सुट्टी ⇒ आधीचा trading day"}
