name: Trigger Upstox Token Request (रोज सकाळी मोबाईल Approval)

# 🎓 Production-readiness सुधारणा — याआधी रोजचा token refresh पूर्णपणे मानवी आठवणीवर अवलंबून होता
# (कुणीतरी सकाळी मॅन्युअली trigger_upstox_token_request.py चालवायचं, मग check_token_freshness.py
# फक्त अलर्ट द्यायचं — पण refresh प्रक्रिया सुरूच करायचं नाही). त्यासाठी इथे रोज सकाळी ०७:०० IST चा
# `schedule` cron होता — पण प्रत्यक्ष run history तपासली असता (वापरकर्त्याने "notification आलंच नाही,
# ७:३० झाले" अशी तक्रार केल्यावर) तो GitHub Actions cron १६/१७ सप्टेंबरनंतर एकदाही आपोआप चाललाच नव्हता
# (GitHub स्वतः "scheduled workflows are best-effort, can be delayed/skipped under load" असं सांगतं —
# या repo मध्ये आधीच ६-७ इतर scheduled workflows आहेत). म्हणून हा daily trigger आता VPS च्या स्वतःच्या
# crontab वर हलवला आहे (deploy/README.md "Upstox Token Webhook" विभाग बघा — इतर वेळ-संवेदनशील jobs
# आधीपासूनच याच कारणासाठी तिथे आहेत). हा workflow आता फक्त मॅन्युअल/backup ट्रिगर म्हणून ठेवलाय.

on:
  workflow_dispatch:  # backup — VPS crontab (deploy/README.md बघा) हाच आता खरा, रोजचा ट्रिगर आहे

jobs:
  trigger-token-request:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout करणे
        uses: actions/checkout@v4

      - name: Python सेटअप करणे
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: आवश्यक dependency स्थापित करणे
        run: pip install requests

      - name: Upstox कडे Token Request पाठवणे
        env:
          UPSTOX_CLIENT_ID: ${{ secrets.UPSTOX_CLIENT_ID }}
          UPSTOX_CLIENT_SECRET: ${{ secrets.UPSTOX_CLIENT_SECRET }}
        run: python3 trigger_upstox_token_request.py
