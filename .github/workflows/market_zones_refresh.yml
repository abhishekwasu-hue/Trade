name: Market Zones Refresh (रोज — S/R, Order Block, Demand/Supply, Gaps)

# 🎓 वापरकर्त्याशी चर्चा करून जोडलेली सुधारणा — आधी साप्ताहिक होतं, आता रोज (बाजार बंद झाल्यावर) —
# जेणेकरून दुसऱ्या दिवसाचा trade-plan नेहमी आदल्या दिवसाच्या ताज्या डेटावरून आपोआप तयार असेल.
#
# 🎓 वापरकर्त्याने सापडवलेली bug — SRv2 Momentum-Reversal चा Signal Log रिकामा दिसत होता ("Srv2 log
# disat nnahi"). Root cause: हा 15M/30M/60M zones (SRv2 यावरच अवलंबून) चा एकमेव स्रोत होता, आणि
# प्रत्यक्ष run history तपासली असता तो GitHub Actions `schedule` cron शेवटचा १८ सप्टेंबरलाच यशस्वी
# झाला होता — trigger_upstox_token_request.yml सारखीच "scheduled workflows are best-effort" समस्या.
# म्हणून हाही आता VPS crontab वर हलवला आहे (deploy/README.md "Market Zones Refresh" विभाग बघा) —
# `workflow_dispatch` फक्त मॅन्युअल/backup साठी उरलाय.

on:
  workflow_dispatch:  # backup — VPS crontab (deploy/README.md बघा) हाच आता खरा, रोजचा ट्रिगर आहे

jobs:
  refresh-zones:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout करणे
        uses: actions/checkout@v4

      - name: Python सेटअप करणे
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies स्थापित करणे
        run: pip install -r requirements.txt

      - name: Market Zones गणना करून Supabase मध्ये साठवणे
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 refresh_market_zones.py
