name: Market Zones Refresh (रोज — S/R, Order Block, Demand/Supply, Gaps)

# 🎓 वापरकर्त्याशी चर्चा करून जोडलेली सुधारणा — आधी साप्ताहिक होतं, आता रोज (बाजार बंद झाल्यावर) —
# जेणेकरून दुसऱ्या दिवसाचा trade-plan नेहमी आदल्या दिवसाच्या ताज्या डेटावरून आपोआप तयार असेल.

on:
  schedule:
    # UTC 10:00 = IST 15:30 (बाजार बंद झाल्यावर), सोमवार ते शुक्रवार
    - cron: "0 10 * * 1-5"
  workflow_dispatch:  # हवं तेव्हा हातानेही चालवता येतं

jobs:
  refresh-zones:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout करणे
        uses: actions/checkout@v4

      - name: Python सेटअप करणे
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies स्थापित करणे
        run: pip install -r requirements.txt

      - name: Market Zones गणना करून Supabase मध्ये साठवणे
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 refresh_market_zones.py --token "$UPSTOX_TOKEN"
