name: Dynamic S/R Instant Trader (दर १० मिनिटं, बाजार तासात)

# 🎓 वापरकर्त्याशी चर्चा करून बांधलेली सुधारणा — Chart वर दाखवला जाणारा Dynamic S/R (strength>=2,
# market_zones_refresh.yml ने आधीच रोज साठवलेला) — LTP ने त्या level ला स्पर्श केला की, कुठलीही
# candle-पुष्टी न घेता, तात्काळ PAPER Option Spread trade + Telegram notification.
#
# ⚠️ हे market_zones_refresh.yml (जे झोन्स साठवतं) पासून पूर्णपणे वेगळं आहे — हे फक्त साठवलेल्या
# झोन्सवर LTP-आधारित निरीक्षण करतं, कुठलीही नवीन गणना करत नाही.

on:
  schedule:
    # UTC 3:45 ते 10:00 (IST 9:15 ते 15:30, बाजार तासांशी जुळणारं), दर १० मिनिटं, सोम-शुक्र
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:  # हवं तेव्हा हातानेही चालवता येतं

jobs:
  monitor-dynamic-sr:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout करणे
        uses: actions/checkout@v4

      - name: Python सेटअप करणे
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies स्थापित करणे
        run: pip install -r requirements.txt

      - name: LTP तपासून, Dynamic S/R hit झाल्यास PAPER trade
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 dynamic_sr_instant_trader.py --token "$UPSTOX_TOKEN"
