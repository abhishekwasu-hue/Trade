name: Dynamic S/R Instant Trader — DISABLED (VPS वर, दर १ मिनिट चालतंय)

# 🎓 वापरकर्त्याशी चर्चा करून बांधलेली सुधारणा — Chart वर दाखवला जाणारा Dynamic S/R (strength>=2,
# market_zones_refresh.yml ने आधीच रोज साठवलेला) — LTP ने त्या level ला स्पर्श केला की, कुठलीही
# candle-पुष्टी न घेता, तात्काळ PAPER Option Spread trade + Telegram notification.
#
# ⚠️ वापरकर्त्याशी चर्चा करून जोडलेली सुधारणा — established VPS (DigitalOcean) वर आता खरा दर-१-मिनिटाचा
# cron कार्यरत आहे (GitHub Actions च्या ५-मिनिट मर्यादेपेक्षा जास्त वारंवार) — त्यामुळे इथला automatic
# schedule काढला (डुप्लिकेट trades टाळण्यासाठी). हवं तेव्हा हातानेच ("Run workflow") अजूनही चालवता येतं.
#
# ⚠️ हे market_zones_refresh.yml (जे झोन्स साठवतं) पासून पूर्णपणे वेगळं आहे — हे फक्त साठवलेल्या
# झोन्सवर LTP-आधारित निरीक्षण करतं, कुठलीही नवीन गणना करत नाही.

on:
  workflow_dispatch:  # फक्त हातानेच चालवण्यासाठी -- automatic schedule VPS वर आहे

jobs:
  monitor-dynamic-sr:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout करणे
        uses: actions/checkout@v4

      - name: Python सेटअप करणे
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies स्थापित करणे
        run: pip install -r requirements.txt

      - name: LTP तपासून, Dynamic S/R hit झाल्यास PAPER trade
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 dynamic_sr_instant_trader.py --token "$UPSTOX_TOKEN"
