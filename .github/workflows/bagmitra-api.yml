name: BagMitra API

on:
  push:
    branches: [main]
    paths: ["bagmitra/api/**", "bagmitra/docs/api/**", "bagmitra/product.env", ".github/workflows/bagmitra-api.yml"]
  pull_request:
    paths: ["bagmitra/api/**", "bagmitra/docs/api/**", "bagmitra/product.env", ".github/workflows/bagmitra-api.yml"]

defaults:
  run:
    working-directory: bagmitra/api

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bagmitra/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types (mypy --strict)
        run: mypy src tests alembic
      - name: Security (bandit)
        run: bandit -q -c pyproject.toml -r src
      - name: Tests (coverage gate 85%)
        run: pytest
      - name: OpenAPI is up to date
        run: |
          python -m bagmitra_api.export_openapi /tmp/openapi.json
          diff -u ../docs/api/openapi.json /tmp/openapi.json

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: bagmitra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bagmitra/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Upgrade / downgrade / upgrade + RLS on every table
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:pg@localhost:5432/bagmitra
        run: pytest -m postgres --no-cov
