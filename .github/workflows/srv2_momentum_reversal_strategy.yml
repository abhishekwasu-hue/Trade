name: SRv2 Momentum-Filter Reversal (Nifty) — DISABLED (VPS वर, दर १ मिनिट चालतंय)

# 🎓 वापरकर्त्याशी चर्चा करून, संपूर्ण blueprint वरून बांधलेली नवीन रणनीती —
# established SRv2 (Chart वर दाखवला जाणारा) + 0.40% दिशात्मक-गती फिल्टर + ATM+1/ATM+3 Credit Spread +
# One-Touch/Cooldown (established srv2_strategy_state, Supabase) — सुरुवातीला फक्त PAPER mode.
#
# ⚠️ वापरकर्त्याशी चर्चा करून जोडलेली सुधारणा — established VPS (DigitalOcean) वर आता खरा दर-१-मिनिटाचा
# cron कार्यरत आहे (GitHub Actions च्या ५-मिनिट मर्यादेपेक्षा जास्त वारंवार) — त्यामुळे इथला automatic
# schedule काढला (डुप्लिकेट trades टाळण्यासाठी). हवं तेव्हा हातानेच ("Run workflow") अजूनही चालवता येतं.

on:
  workflow_dispatch:  # फक्त हातानेच चालवण्यासाठी -- automatic schedule VPS वर आहे

jobs:
  srv2-momentum-reversal:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout करणे
        uses: actions/checkout@v4

      - name: Python सेटअप करणे
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies स्थापित करणे
        run: pip install -r requirements.txt

      - name: SRv2 Momentum-Reversal तपासून, आढळल्यास PAPER trade
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 srv2_momentum_reversal_strategy.py --token "$UPSTOX_TOKEN"
