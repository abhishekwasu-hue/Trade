name: OI Snapshot Collector (मॅन्युअल-only — आता VPS cron वर दर ५ मिनिटं चालतं)

# 🎓 वापरकर्त्याशी चर्चा करून बांधलेली सुधारणा — मूळ समस्या: संगणक सतत चालू ठेवता येत नाही, त्यामुळे
# OI snapshots मध्ये gaps पडायचे. आता GitHub Actions (कुठलंही उपकरण चालू ठेवायची गरज नाही) +
# Supabase (cloud DB, आत्ताच यशस्वीरित्या जोडलं) एकत्र — डेटा थेट cloud मध्ये साठतो, Dashboard तिथूनच
# वाचतं (page_dashboard.py/oi_analysis.py आधीच cloud_db.py वापरण्यासाठी तयार आहेत).
#
# PDF सारखं इथे repo मध्ये काहीही commit करायची गरज नाही -- डेटा थेट Supabase मध्ये जातो.
#
# 🎓 वापरकर्त्याशी चर्चा करून जोडलेली सुधारणा — आता Dashboard वर 5/10/15-मिनिट असे ३ selectable
# view-पर्याय हवेत (एकाच वेळी सर्व दिसण्याऐवजी) -- त्यासाठी collection ला परत सर्वात बारीक (५ मिनिट)
# पातळीवर आणलं, जेणेकरून 10/15-मिनिट views ५-मिनिटांच्याच डेटावरून योग्यरित्या aggregate होतील.
#
# 🎓 वापरकर्त्याशी चर्चा करून जोडलेली सुधारणा (Every-5-min GitHub Actions Delay फिक्स) — GitHub
# Actions established `*/5` (दर ५ मिनिटं) हे जगातल्या हजारो repos मधलं सर्वात लोकप्रिय schedule
# असल्यामुळे, high-load मुळे असे वारंवार होणारे schedules मुद्दामच delay/skip करतं (established Actions
# tab वर प्रत्यक्ष ~१५-२० मिनिटांच्या अंतराने run्स दिसत होते, ५ मिनिटं नाही — GitHub च्या मोफत सेवेची
# अंगभूत मर्यादा, कोडची चूक नाही). आता established `dynamic_sr_instant_trader.py`/
# `srv2_momentum_reversal_strategy.py`/`trade_monitor.py` प्रमाणेच VPS crontab वर (दर १ मिनिटाला,
# अचूक, delay शिवाय) हलवलं — हा workflow आता फक्त हाताने चालवण्यासाठी (backup/testing) उरलाय.

on:
  workflow_dispatch:  # हवं तेव्हा हाताने चालवण्यासाठी (backup/testing) — आपोआप (schedule) चालत नाही

jobs:
  collect-oi-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout करणे
        uses: actions/checkout@v4

      - name: Python सेटअप करणे
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies स्थापित करणे
        run: pip install -r requirements.txt

      - name: OI Snapshot गोळा करणे (Supabase मध्ये थेट साठवलं जाईल)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 oi_snapshot_collector.py
