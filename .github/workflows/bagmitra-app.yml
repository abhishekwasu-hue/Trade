name: BagMitra App

on:
  push:
    branches: [main]
    paths: ["bagmitra/app/**", "bagmitra/docs/api/**", "bagmitra/product.env", ".github/workflows/bagmitra-app.yml"]
  pull_request:
    paths: ["bagmitra/app/**", "bagmitra/docs/api/**", "bagmitra/product.env", ".github/workflows/bagmitra-app.yml"]

defaults:
  run:
    working-directory: bagmitra/app

env:
  # Goldens are rendered on Linux with this exact version; keep in sync with docs/runbooks/local-dev.md.
  FLUTTER_VERSION: "3.47.5"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: OpenAPI spec copy matches the API contract
        run: diff -u ../docs/api/openapi.json openapi/bagmitra.openapi.json
      - name: Regenerate API client, Drift code and l10n; fail on drift
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib > /dev/null
          git diff --exit-code -- lib
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze (zero issues)
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Tests incl. goldens, offline->online sync, architecture rules
        run: flutter test --coverage
      - name: Logic coverage gate (80%)
        run: dart run tool/coverage_gate.dart 80
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: bagmitra/app/test/**/failures/

  apk:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK (split per ABI keeps each download small)
        run: flutter build apk --release --split-per-abi --dart-define-from-file=../product.env
      - name: Report APK sizes (budget < 25 MB)
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bagmitra-apk
          path: bagmitra/app/build/app/outputs/flutter-apk/*.apk
