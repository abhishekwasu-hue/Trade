# AMW A1 — Multi-Strategy Config
# प्रत्येक strategy independently enable/disable + tune करता येते

orchestrator:
  conflict_mode: "veto"          # veto | highest_confidence | weighted_vote
  min_confidence_to_act: 0.5

strategies:
  oi_pcr:
    enabled: true
    weight: 1.0
    max_positions: 2
    atm_range: 3
    min_oi_change_pct: 5.0
    pcr_shift_threshold: 0.05

  ict_fvg:
    enabled: true
    weight: 1.2
    max_positions: 1
    fvg_entry_buffer_pct: 1.0   # ⚠️ आधी 0.1% होता -- NIFTY च्या ~15000 किमतीवर तो फक्त ~15 पॉइंट्सची सूट
                                # द्यायचा, त्यामुळे 4 वर्षांत फक्त 11 सिग्नल्स यायचे. खऱ्या डेटावर तपासून
                                # (0.1→1.0% ने 11→119 सिग्नल्स, win rate 30%→50%, P&L -1225→+12859 पॉइंट्स)
                                # 1.0% हा उत्तम संतुलन सापडला.
    require_choch: false
    target_rr: 2.0
    max_fvg_age_bars: 20   # 🎓 FVG zone यापेक्षा जुना असेल तर stale मानून वगळणे

  bb_squeeze:
    enabled: true
    weight: 0.8
    max_positions: 2
    squeeze_percentile: 20
    volume_spike_multiplier: 1.5
    lookback: 50
    atr_sl_multiplier: 1.5
    target_rr: 2.0

  vwap:
    enabled: true
    weight: 1.0
    max_positions: 2
    retracement_tolerance_pct: 0.1   # VWAP च्या किती % आत आलं की 'retracement झाली' मानायचं
    extension_lookback: 10           # खरा trend तपासण्यासाठी गेल्या किती bars बघायचे
    min_extension_pct: 0.15          # त्या lookback मध्ये किमान किती % VWAP पासून लांब गेलेलं हवं
    sl_buffer_pct: 0.05              # SL साठी VWAP पासून किती % पलीकडे buffer
    target_rr: 1.5
    require_candlestick_confirmation: true   # 🎓 कडक गेट: reversal candlestick pattern हवाच
    pattern_lookback: 3                      # candlestick pattern current + मागच्या किती bars मध्ये शोधायचा
    require_rsi_filter: true                 # 🎓 कडक गेट: RSI आधीच खूप extended नसावा
    rsi_long_max: 65                         # LONG साठी RSI याहून जास्त असेल तर entry नाही
    rsi_short_min: 35                        # SHORT साठी RSI याहून कमी असेल तर entry नाही

  sr_bounce:
    enabled: true
    weight: 1.0
    max_positions: 2
    min_touches: 3              # 🎓 फक्त high-probability levels (किमान इतके touches) वापरायचे
    retest_tolerance_pct: 0.15  # level च्या किती % आत आलं की 'retest झाली' मानायचं
    pattern_lookback: 3         # candlestick pattern current + मागच्या किती bars मध्ये शोधायचा
    sl_pct: 0.25                 # 🎓 SL — entry (index) किमतीच्या सरळ 0.25% वर (NIFTY ~24000 वर ~60 पॉइंट्स)
    target_rr: 2.0              # पुढचा S/R level उपलब्ध नसेल तर किमान Risk:Reward

  mtf_gap_fill:
    enabled: true
    weight: 1.0
    max_positions: 1
    min_swing_pct: 1.0    # 1H swings साठी किमान टक्केवारी (क्षुल्लक swings वगळण्यासाठी)
    min_gap_pct: 0.30     # overnight gap ची किमान रुंदी (टक्केवारी) -- क्षुल्लक gaps वगळण्यासाठी
    sl_pct: 0.25          # SL -- gap-fill entry किमतीच्या 0.25%
    target_pct: 0.70      # Target -- gap-fill entry किमतीच्या 0.70% (RR≈1:2.8)

  opportunity_engine:
    enabled: false              # 🎓 PR-1b: structure/bias/gate/score पाया तयार; detectors (D1–D3) PR-1c मध्ये — तोपर्यंत बंद. Orchestrator फक्त दाखवतो, order नाही.
    weight: 1.0
    max_positions: 1
    primary_htf: "4h"           # bias = 4H, Daily = veto, 1H = पुष्टी ("1d" ने Daily primary)
    daily_veto: true
    consensus_mode: "off"       # 🎓 PR-V Dual-Eye: off (फक्त माहिती) | score | gate — backfill + 3 modes तुलना अहवालानंतरच बदला. Visual audit स्वतः env VISUAL_AUDIT_ENABLED ने चालू.

# 🎓 Market data: NSE Closing Auction Session (CAS) — opportunity_engine/cas.py.
# NSE/CMTR/75479 (30 Jul 2026): CAS 3 Aug 2026 पासून. Index 1m bars 15:15 पासून गोठतात आणि 15:28/15:29 ला auction close ची उडी छापतात
# ⇒ structure (swings, areas, MR, PDH/PDL, candidates, real break) मधून त्या bars ची high/low वगळतो; official close (PDC) तसाच.
market_data:
  cas_window:
    enabled: true
    effective_from: "2026-08-03"
    start: "15:15"              # bar-start वेळ, start ≤ t < end
    end: "15:30"
    chart: "grey"               # grey = राखाडी + "CAS" label | exclude = chart वरून वगळा
    circular: "NSE/CMTR/75479 (2026-07-30): CAS 15:15–15:35 from 2026-08-03"

# 🎓 Abhi (Monday PAPER) — PAPER trading मार्ग: signal → Vision → ✅ approval → PAPER entry. आकडे इथून / dashboard वरून, code मध्ये नाहीत.
paper:
  instruments:                 # enabled: false ⇒ त्या symbol वर PAPER entry नाही (approval मार्गही नाही)
    NIFTY: {enabled: true, lot_size_fallback: 65}        # lot size Upstox instrument master मधून; हा फक्त fallback (जुळलं नाही ⇒ Telegram इशारा)
    BANKNIFTY: {enabled: false, lot_size_fallback: 30}
    SENSEX: {enabled: false, lot_size_fallback: 20}
  update_every_min: 30         # उघड्या PAPER trade चा P&L Telegram वर दर इतक्या मिनिटांनी
  near_alert_pct: 80           # SL / target च्या इतक्या % जवळ पोचला ⇒ एकदा इशारा
  entry_cutoff: "14:45"        # ✋ /paper: यानंतर नवीन manual entry नाही (bots सारखंच; EOD square-off जवळ)
